<html class="staticrypt-html">

        <meta charset="utf-8" />
        <title>Offer</title>

        <style>
            :root {
                --blue: #2e72b8;
                --blue-deep: #1f5a99;
                --blue-dim: #8aaed0;
                --blue-logo: #5a8bae;
                --bg-soft: #f4f6f9;
                --bg-logo: #f9f4f3;
                --ink: #222222;
                --muted: #666666;
            }

            .staticrypt-html {
                height: 100%;
            }

            .staticrypt-body {
                height: 100%;
                margin: 0;
            }

            .staticrypt-content {
                min-height: 100%;
                margin-bottom: 1em;
                background: var(--bg-soft);
                font-family: "Space Mono", ui-monospace, monospace;
                color: var(--ink);
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
                box-sizing: border-box;
            }

            .staticrypt-page {
                max-width: 400px;
                padding: 10vh 16px 0;
                margin: auto;
                box-sizing: border-box;
            }

            .staticrypt-form {
                position: relative;
                z-index: 1;
                background: #ffffff;
                border: 2px solid var(--blue);
                margin: 0 auto 60px;
                padding: 36px 32px 32px;
                text-align: center;
            }

            .vibehuus-logo {
                display: inline-block;
                margin-bottom: 22px;
            }

            .vibehuus-logo img {
                width: 150px;
                max-width: 100%;
                height: auto;
                display: block;
            }

            .staticrypt-title {
                font-family: "Bebas Neue", Impact, sans-serif;
                font-weight: 400;
                color: var(--blue);
                font-size: 34px;
                line-height: 1;
                letter-spacing: 1px;
                margin: 0 0 10px;
            }

            .vibehuus-subtitle {
                font-size: 12px;
                font-weight: 700;
                letter-spacing: 1.5px;
                color: var(--blue-dim);
                text-transform: uppercase;
                margin: 0 0 12px;
            }

            .staticrypt-instructions p:last-child {
                font-size: 13px;
                color: var(--muted);
                margin: 0 0 4px;
                line-height: 1.5;
            }

            .staticrypt-hr {
                margin: 20px 0;
                border: 0;
                border-top: 1.5px solid var(--blue-dim);
            }

            .staticrypt-form input[type="password"],
            input[type="text"] {
                background: inherit;
                border: 0;
                box-sizing: border-box;
                font-family: "Space Mono", monospace;
                font-size: 14px;
                color: var(--ink);
                outline: 0;
                padding: 14px 44px 14px 14px;
                width: 100%;
            }

            .staticrypt-form input::placeholder {
                color: var(--blue-dim);
            }

            .staticrypt-password-container {
                position: relative;
                outline: 0;
                background: var(--bg-soft);
                border: 1.5px dashed var(--blue-dim);
                width: 100%;
                margin: 0 0 16px;
                box-sizing: border-box;
            }

            .staticrypt-password-container:focus-within {
                border: 1.5px solid var(--blue);
            }

            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 18px;
                opacity: 55%;
                padding: 13px;
                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
                width: 18px;
            }

            .staticrypt-form .staticrypt-decrypt-button {
                font-family: "Space Mono", monospace;
                font-weight: 700;
                letter-spacing: 1px;
                text-transform: uppercase;
                outline: 0;
                background: var(--blue);
                width: 100%;
                border: 0;
                padding: 14px;
                color: #ffffff;
                font-size: 14px;
                cursor: pointer;
            }

            .staticrypt-form .staticrypt-decrypt-button:hover,
            .staticrypt-form .staticrypt-decrypt-button:active,
            .staticrypt-form .staticrypt-decrypt-button:focus {
                background: var(--blue-deep);
            }

            label.staticrypt-remember {
                display: flex;
                align-items: center;
                margin-bottom: 1em;
                font-size: 13px;
                color: var(--muted);
            }

            .staticrypt-remember input[type="checkbox"] {
                transform: scale(1.3);
                margin-right: 1em;
                accent-color: var(--blue);
            }

            .vibehuus-footer {
                text-align: center;
                font-size: 12px;
                color: var(--blue-logo);
                margin-top: -34px;
                padding-bottom: 24px;
            }

            .hidden {
                display: none !important;
            }

            .staticrypt-spinner-container {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .staticrypt-spinner {
                display: inline-block;
                width: 2rem;
                height: 2rem;
                vertical-align: text-bottom;
                border: 0.25em solid var(--blue-dim);
                border-right-color: transparent;
                border-radius: 50%;
                animation: spinner-border 0.75s linear infinite;
            }

            @keyframes spinner-border {
                100% {
                    transform: rotate(360deg);
                }
            }

            @media screen and (-webkit-min-device-pixel-ratio: 0) {
                .staticrypt-form input[type="password"],
                input[type="text"] {
                    font-size: 16px;
                }
            }
        </style>
    </head>
